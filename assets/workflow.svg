<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="310" viewBox="0 0 1180 310" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The workflow: six phases (define, plan, build, verify, review, ship), each with its two core skills">
  <title>The workflow: six phases (define, plan, build, verify, review, ship), each with its two core skills</title>
  <rect width="1180" height="310" rx="14" fill="#f8fafc"/>
  <text x="590.0" y="40" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">The workflow: six phases from idea to release</text>
  <text x="590.0" y="62" text-anchor="middle" font-size="12" fill="#64748b">Skills load on their own from the description ("Use when ..."), or by name (/spec)</text>
  <rect x="16.0" y="84" width="178" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M 16.0 118 V 96 a 12 12 0 0 1 12 -12 H 182.0 a 12 12 0 0 1 12 12 V 118 Z" fill="#6366f1"/>
  <text x="105.0" y="106.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">DEFINE</text>
  <text x="105.0" y="140" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">discover</text>
  <text x="105.0" y="157" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">spec</text>
  <line x1="36.0" y1="170" x2="174.0" y2="170" stroke="#e2e8f0"/>
  <text x="105.0" y="192" text-anchor="middle" font-size="11" fill="#64748b">Questions, then 2 or 3</text>
  <text x="105.0" y="207" text-anchor="middle" font-size="11" fill="#64748b">options with trade-offs.</text>
  <text x="105.0" y="222" text-anchor="middle" font-size="11" fill="#64748b">Every change starts</text>
  <text x="105.0" y="237" text-anchor="middle" font-size="11" fill="#64748b">with a spec.</text>
  <path d="M 197.0 168.0 L 207.0 174.0 L 197.0 180.0 Z" fill="#94a3b8"/>
  <rect x="210.0" y="84" width="178" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M 210.0 118 V 96 a 12 12 0 0 1 12 -12 H 376.0 a 12 12 0 0 1 12 12 V 118 Z" fill="#8b5cf6"/>
  <text x="299.0" y="106.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">PLAN</text>
  <text x="299.0" y="140" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">plan</text>
  <text x="299.0" y="157" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">adr</text>
  <line x1="230.0" y1="170" x2="368.0" y2="170" stroke="#e2e8f0"/>
  <text x="299.0" y="192" text-anchor="middle" font-size="11" fill="#64748b">Small ordered tasks,</text>
  <text x="299.0" y="207" text-anchor="middle" font-size="11" fill="#64748b">dependencies, risks.</text>
  <text x="299.0" y="222" text-anchor="middle" font-size="11" fill="#64748b">An ADR when a choice</text>
  <text x="299.0" y="237" text-anchor="middle" font-size="11" fill="#64748b">is hard to reverse.</text>
  <path d="M 391.0 168.0 L 401.0 174.0 L 391.0 180.0 Z" fill="#94a3b8"/>
  <rect x="404.0" y="84" width="178" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M 404.0 118 V 96 a 12 12 0 0 1 12 -12 H 570.0 a 12 12 0 0 1 12 12 V 118 Z" fill="#0ea5e9"/>
  <text x="493.0" y="106.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">BUILD</text>
  <text x="493.0" y="140" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">incremental-implementation</text>
  <text x="493.0" y="157" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">test-driven-development</text>
  <line x1="424.0" y1="170" x2="562.0" y2="170" stroke="#e2e8f0"/>
  <text x="493.0" y="192" text-anchor="middle" font-size="11" fill="#64748b">Thin slices, each</text>
  <text x="493.0" y="207" text-anchor="middle" font-size="11" fill="#64748b">with a test that</text>
  <text x="493.0" y="222" text-anchor="middle" font-size="11" fill="#64748b">failed first.</text>
  <path d="M 585.0 168.0 L 595.0 174.0 L 585.0 180.0 Z" fill="#94a3b8"/>
  <rect x="598.0" y="84" width="178" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M 598.0 118 V 96 a 12 12 0 0 1 12 -12 H 764.0 a 12 12 0 0 1 12 12 V 118 Z" fill="#10b981"/>
  <text x="687.0" y="106.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">VERIFY</text>
  <text x="687.0" y="140" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">debugging</text>
  <text x="687.0" y="157" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">qa-testing</text>
  <line x1="618.0" y1="170" x2="756.0" y2="170" stroke="#e2e8f0"/>
  <text x="687.0" y="192" text-anchor="middle" font-size="11" fill="#64748b">Reproduce, isolate,</text>
  <text x="687.0" y="207" text-anchor="middle" font-size="11" fill="#64748b">fix the cause.</text>
  <text x="687.0" y="222" text-anchor="middle" font-size="11" fill="#64748b">Risk-based</text>
  <text x="687.0" y="237" text-anchor="middle" font-size="11" fill="#64748b">test plans.</text>
  <path d="M 779.0 168.0 L 789.0 174.0 L 779.0 180.0 Z" fill="#94a3b8"/>
  <rect x="792.0" y="84" width="178" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M 792.0 118 V 96 a 12 12 0 0 1 12 -12 H 958.0 a 12 12 0 0 1 12 12 V 118 Z" fill="#f59e0b"/>
  <text x="881.0" y="106.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">REVIEW</text>
  <text x="881.0" y="140" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">code-review</text>
  <text x="881.0" y="157" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">security-hardening</text>
  <line x1="812.0" y1="170" x2="950.0" y2="170" stroke="#e2e8f0"/>
  <text x="881.0" y="192" text-anchor="middle" font-size="11" fill="#64748b">Fresh-context review:</text>
  <text x="881.0" y="207" text-anchor="middle" font-size="11" fill="#64748b">ranked findings</text>
  <text x="881.0" y="222" text-anchor="middle" font-size="11" fill="#64748b">and a verdict.</text>
  <path d="M 973.0 168.0 L 983.0 174.0 L 973.0 180.0 Z" fill="#94a3b8"/>
  <rect x="986.0" y="84" width="178" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M 986.0 118 V 96 a 12 12 0 0 1 12 -12 H 1152.0 a 12 12 0 0 1 12 12 V 118 Z" fill="#ef4444"/>
  <text x="1075.0" y="106.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">SHIP</text>
  <text x="1075.0" y="140" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">ship</text>
  <text x="1075.0" y="157" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">release</text>
  <line x1="1006.0" y1="170" x2="1144.0" y2="170" stroke="#e2e8f0"/>
  <text x="1075.0" y="192" text-anchor="middle" font-size="11" fill="#64748b">Checks run, short PR,</text>
  <text x="1075.0" y="207" text-anchor="middle" font-size="11" fill="#64748b">staged rollout,</text>
  <text x="1075.0" y="222" text-anchor="middle" font-size="11" fill="#64748b">rollback ready.</text>
  <text x="590.0" y="292" text-anchor="middle" font-size="12" fill="#64748b">Humans approve the plan and the merge. Deterministic gates (hooks, CI) over model memory.</text>
</svg>
