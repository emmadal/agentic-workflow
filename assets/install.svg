<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="380" viewBox="0 0 1150 380" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1150" height="380" fill="#f8fafc"/>
  <text x="575" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Install into any project</text>

  <!-- this repo -->
  <g>
    <rect x="40" y="70" width="300" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="70" width="300" height="36" rx="12" fill="#4f46e5"/>
    <rect x="40" y="94" width="300" height="12" fill="#4f46e5"/>
    <text x="190" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">agentic-workflow</text>
    <text x="190" y="130" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, 'SF Mono', Menlo, monospace">.agents/skills/</text>
    <text x="190" y="150" text-anchor="middle" font-size="12" fill="#64748b">38 skills, tool-neutral</text>
    <text x="190" y="178" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, 'SF Mono', Menlo, monospace">.agents/agents/</text>
    <text x="190" y="198" text-anchor="middle" font-size="12" fill="#64748b">11 role agents, 3 access levels</text>
    <text x="190" y="228" text-anchor="middle" font-size="11" fill="#94a3b8">this repo</text>
  </g>

  <!-- arrow -->
  <line x1="350" y1="160" x2="470" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 470 154 L 484 160 L 470 166 Z" fill="#94a3b8"/>
  <text x="417" y="130" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, 'SF Mono', Menlo, monospace">python -m scripts.install_skills</text>
  <text x="417" y="150" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, 'SF Mono', Menlo, monospace">--tool claude|opencode|cursor|codex|gemini|all</text>
  <text x="417" y="196" text-anchor="middle" font-size="11" fill="#64748b">keeps existing files, --force to overwrite</text>
  <text x="417" y="212" text-anchor="middle" font-size="11" fill="#64748b">never touches AGENTS.md, CLAUDE.md or settings</text>

  <!-- your project -->
  <g>
    <rect x="490" y="70" width="300" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="490" y="70" width="300" height="36" rx="12" fill="#0f172a"/>
    <rect x="490" y="94" width="300" height="12" fill="#0f172a"/>
    <text x="640" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">your project</text>
    <text x="640" y="130" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, 'SF Mono', Menlo, monospace">.claude/ .opencode/ .cursor/</text>
    <text x="640" y="150" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, 'SF Mono', Menlo, monospace">.codex/ .gemini/</text>
    <text x="640" y="178" text-anchor="middle" font-size="12" fill="#64748b">skills and agents land in each</text>
    <text x="640" y="194" text-anchor="middle" font-size="12" fill="#64748b">tool's native location</text>
    <text x="640" y="228" text-anchor="middle" font-size="11" fill="#94a3b8">target project</text>
  </g>

  <!-- arrow -->
  <line x1="800" y1="160" x2="880" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 880 154 L 894 160 L 880 166 Z" fill="#94a3b8"/>

  <!-- result -->
  <g>
    <rect x="900" y="70" width="210" height="180" rx="12" fill="#ffffff" stroke="#86efac"/>
    <rect x="900" y="70" width="210" height="36" rx="12" fill="#10b981"/>
    <rect x="900" y="94" width="210" height="12" fill="#10b981"/>
    <text x="1005" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">restart your tool</text>
    <text x="1005" y="130" text-anchor="middle" font-size="12" fill="#475569">38 skills and 11 agents</text>
    <text x="1005" y="150" text-anchor="middle" font-size="12" fill="#475569">load automatically</text>
    <text x="1005" y="178" text-anchor="middle" font-size="12" fill="#64748b">about 70 tokens each</text>
    <text x="1005" y="198" text-anchor="middle" font-size="12" fill="#64748b">sit in context</text>
    <text x="1005" y="228" text-anchor="middle" font-size="11" fill="#94a3b8">done</text>
  </g>

  <text x="575" y="300" text-anchor="middle" font-size="12" fill="#64748b">Claude Code also installs as a plugin: /plugin marketplace add emmadal/agentic-workflow</text>
  <text x="575" y="322" text-anchor="middle" font-size="12" fill="#64748b">or install all tools at once with --tool all</text>
  <text x="575" y="356" text-anchor="middle" font-size="12" fill="#94a3b8">Needs Python 3.11+ and nothing else. Existing files are kept unless you pass --force.</text>
</svg>
