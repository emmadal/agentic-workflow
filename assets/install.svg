<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="420" viewBox="0 0 1150 420" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Install in three steps: clone this repo, run install_skills on your project, restart your tool">
  <title>Install in three steps: clone this repo, run install_skills on your project, restart your tool</title>
  <rect width="1150" height="420" rx="14" fill="#f8fafc"/>
  <text x="575.0" y="38" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">Install into any project</text>
  <rect x="40.0" y="62" width="330" height="172" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M 40.0 98 V 74 a 12 12 0 0 1 12 -12 H 358.0 a 12 12 0 0 1 12 12 V 98 Z" fill="#4f46e5"/>
  <text x="205.0" y="85.0" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">1 · Clone agentic-workflow</text>
  <text x="205.0" y="126" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.agents/skills/</text>
  <text x="205.0" y="144" text-anchor="middle" font-size="12" fill="#64748b">38 skills, tool-neutral</text>
  <text x="205.0" y="174" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.agents/agents/</text>
  <text x="205.0" y="192" text-anchor="middle" font-size="12" fill="#64748b">11 role agents, 3 access levels</text>
  <text x="205.0" y="218" text-anchor="middle" font-size="11" fill="#94a3b8">this repo</text>
  <rect x="410.0" y="62" width="330" height="172" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M 410.0 98 V 74 a 12 12 0 0 1 12 -12 H 728.0 a 12 12 0 0 1 12 12 V 98 Z" fill="#0f172a"/>
  <text x="575.0" y="85.0" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">2 · Install into your project</text>
  <text x="575.0" y="122" text-anchor="middle" font-size="9" fill="#94a3b8" font-weight="700">CLAUDE CODE</text>
  <text x="575.0" y="139" text-anchor="middle" font-size="11" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.claude/skills/ + .claude/agents/</text>
  <text x="575.0" y="164" text-anchor="middle" font-size="9" fill="#94a3b8" font-weight="700">OPENCODE, CURSOR, CODEX, GEMINI CLI</text>
  <text x="575.0" y="181" text-anchor="middle" font-size="11" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.agents/skills/ + .&lt;tool&gt;/agents/</text>
  <text x="575.0" y="218" text-anchor="middle" font-size="11" fill="#94a3b8">AGENTS.md, CLAUDE.md and settings untouched</text>
  <rect x="780.0" y="62" width="330" height="172" rx="12" fill="#ffffff" stroke="#86efac"/>
  <path d="M 780.0 98 V 74 a 12 12 0 0 1 12 -12 H 1098.0 a 12 12 0 0 1 12 12 V 98 Z" fill="#10b981"/>
  <text x="945.0" y="85.0" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">3 · Restart your tool</text>
  <text x="945.0" y="126" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="600">38 skills and 11 agents</text>
  <text x="945.0" y="144" text-anchor="middle" font-size="12" fill="#64748b">are found on start</text>
  <text x="945.0" y="174" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="600">about 70 tokens per skill</text>
  <text x="945.0" y="192" text-anchor="middle" font-size="12" fill="#64748b">stay in context</text>
  <text x="945.0" y="218" text-anchor="middle" font-size="11" fill="#94a3b8">a skill body loads only when used</text>
  <line x1="376.0" y1="148.0" x2="394.0" y2="148.0" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 392.0 141.0 L 404.0 148.0 L 392.0 155.0 Z" fill="#94a3b8"/>
  <line x1="746.0" y1="148.0" x2="764.0" y2="148.0" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 762.0 141.0 L 774.0 148.0 L 762.0 155.0 Z" fill="#94a3b8"/>
  <rect x="40.0" y="256" width="1070.0" height="104" rx="12" fill="#0f172a"/>
  <text x="64.0" y="288" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#e2e8f0"><tspan fill="#64748b">$ </tspan>python -m scripts.install_skills <tspan fill="#fcd34d">/path/to/your/project</tspan> --tool <tspan fill="#86efac">all</tspan></text>
  <text x="64.0" y="316" text-anchor="start" font-size="12" fill="#94a3b8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"># --tool claude | opencode | cursor | codex | gemini | all  (default: claude)</text>
  <text x="64.0" y="338" text-anchor="start" font-size="12" fill="#94a3b8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"># --dry-run previews the copy, --force overwrites existing files</text>
  <text x="575.0" y="388" text-anchor="middle" font-size="12" fill="#64748b">Claude Code can also install it as a plugin: /plugin marketplace add emmadal/agentic-workflow</text>
  <text x="575.0" y="406" text-anchor="middle" font-size="12" fill="#94a3b8">Needs Python 3.11+ and nothing else.</text>
</svg>
